name: release (manual)

run-name: Release ${{ github.event.inputs.tag_name }}

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create or update, for example v0.2.0
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release Preflight
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend checks
        run: |
          bun run test
          bun run build

      - name: Run Rust checks
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --quiet
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Assert version files match release tag
        run: |
          set -e
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          VERSION="${INPUT_TAG#v}"
          VERSION="${VERSION%-rc.*}"
          if [ -z "$VERSION" ]; then
            echo "::error::tag_name input is empty after stripping 'v' / '-rc.N'"
            exit 1
          fi
          PKG_VER=$(node -p "require('./package.json').version")
          # Extract first version line within [package] section, then strip to value via sed (awk gsub backrefs are non-portable).
          CARGO_VER=$(awk '/^\[package\]/{p=1;next}/^\[/{p=0}p && /^version[[:space:]]*=/{print;exit}' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          TAURI_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          STRIPPED_PKG="${PKG_VER%-rc.*}"
          STRIPPED_CARGO="${CARGO_VER%-rc.*}"
          STRIPPED_TAURI="${TAURI_VER%-rc.*}"
          # Compare against the FULL tag-version (including any -rc.N) so rc tags must match rc versions exactly
          FULL_VERSION="${INPUT_TAG#v}"
          FAIL=0
          if [ "$PKG_VER" != "$FULL_VERSION" ]; then
            echo "::error file=package.json::Version mismatch: tag=$FULL_VERSION, package.json=$PKG_VER"
            FAIL=1
          fi
          if [ "$CARGO_VER" != "$FULL_VERSION" ]; then
            echo "::error file=src-tauri/Cargo.toml::Version mismatch: tag=$FULL_VERSION, Cargo.toml=$CARGO_VER"
            FAIL=1
          fi
          if [ "$TAURI_VER" != "$FULL_VERSION" ]; then
            echo "::error file=src-tauri/tauri.conf.json::Version mismatch: tag=$FULL_VERSION, tauri.conf.json=$TAURI_VER"
            FAIL=1
          fi
          if [ $FAIL -eq 1 ]; then
            echo "Run 'bun run release:bump $FULL_VERSION' locally and commit before re-triggering the release."
            exit 1
          fi
          echo "All version files match tag $FULL_VERSION."

      - name: Check for REPLACE_WITH_ placeholders in release-critical config
        run: |
          set -e
          FILES=(src-tauri/tauri.conf.json src-tauri/Cargo.toml package.json src-tauri/src/download.rs)
          FOUND=0
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then
              continue
            fi
            if grep -nH 'REPLACE_WITH_' "$f" >/dev/null 2>&1; then
              while IFS= read -r line; do
                file=$(echo "$line" | cut -d: -f1)
                lineno=$(echo "$line" | cut -d: -f2)
                echo "::error file=${file},line=${lineno}::REPLACE_WITH_ placeholder remains — fix before releasing"
              done < <(grep -nH 'REPLACE_WITH_' "$f")
              FOUND=1
            fi
          done
          [ $FOUND -eq 0 ] || exit 1
          echo "No REPLACE_WITH_ placeholders found."

  release:
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache sherpa-rs-sys binaries
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sherpa-rs
            ~/Library/Caches/sherpa-rs
            $LOCALAPPDATA/sherpa-rs
          key: sherpa-rs-0.6.8-${{ runner.os }}-${{ runner.arch }}

      - name: Warn on sherpa-rs cache miss
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        run: echo "::warning::sherpa-rs binary cache miss — build will download from network (slower)"

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend and check bundle size
        run: |
          bun run build
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const assetsDir = 'dist/assets';
          if (!fs.existsSync(assetsDir)) {
            console.log('dist/assets not found, skipping size check');
            process.exit(0);
          }

          const chunks = fs
            .readdirSync(assetsDir)
            .filter((name) => name.endsWith('.js'))
            .map((name) => ({
              name,
              size: fs.statSync(path.join(assetsDir, name)).size,
            }))
            .sort((a, b) => b.size - a.size);

          console.log('Bundle chunks:');
          for (const chunk of chunks) {
            console.log(`  ${chunk.name}: ${Math.round(chunk.size / 1024)} KB`);
          }

          const totalSize = chunks.reduce((sum, chunk) => sum + chunk.size, 0);
          console.log(`Total JS: ${Math.round(totalSize / 1024)} KB`);

          const largest = chunks[0];
          const warningLimitBytes = 1400 * 1024;
          if (largest && largest.size > warningLimitBytes) {
            console.log(
              `::warning::Largest chunk ${largest.name} is ${Math.round(largest.size / 1024)}KB, exceeds ${Math.round(warningLimitBytes / 1024)}KB warning threshold`,
            );
          }
          NODE

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.6.2  # pinned 2026-03-14; per CONFIG-05; update only after testing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag_name }}
          releaseName: "openNotes ${{ github.event.inputs.tag_name }}"
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
